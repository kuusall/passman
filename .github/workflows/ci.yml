name: Linux CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Note: ubuntu-latest is used as a general Linux test runner.
    # While the project targets Arch Linux, GitHub's standard runners are Ubuntu.
    # We use apt-get here because the runner OS is Ubuntu.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libsodium-dev wl-clipboard

    - name: Configure Build
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure

    - name: Build with Sanitizers
      run: |
        cmake -S . -B build-sanitize -DPASSMAN_ENABLE_SANITIZERS=ON
        cmake --build build-sanitize
        ctest --test-dir build-sanitize --output-on-failure
