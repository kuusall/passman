name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package macOS arm64 release
        run: ./scripts/package-release.sh
      - name: Verify archive contents
        run: |
          tar -tzf release/passman-1.0.0-macos-arm64.tar.gz
          shasum -a 256 -c SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: passman-1.0.0-macos-arm64
          path: |
            release/passman-1.0.0-macos-arm64.tar.gz
            SHA256SUMS
